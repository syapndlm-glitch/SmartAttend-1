<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartAttend | Teacher Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="teacher-body">
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <a href="index.html" class="brand"><span>SA</span> SmartAttend</a>
      <div class="sidebar-card">
        <div class="card-label">ACTIVE SESSION</div>
        <div id="code" class="session-code">------</div>
        <div class="timer-badge">Expires in <span id="timer">01:00</span></div>
        <div id="qrcode" class="qr-box"></div>
        <div class="action-stack">
          <button class="btn btn-primary" onclick="generateNewCode()">Generate New Code</button>
          <button class="btn btn-secondary" onclick="copyCode()">Copy Code</button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="dashboard-header">
        <div>
          <p class="eyebrow">LIVE MONITOR</p>
          <h1>Class Attendance Roster</h1>
        </div>
        <div class="header-actions">
          <div class="counter"><span id="count">0</span> Students Present</div>
          <button class="btn btn-danger" onclick="clearAttendance()">Reset Roster</button>
        </div>
      </header>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Roll Number</th>
              <th>Student Name</th>
              <th>Time Checked In</th>
            </tr>
          </thead>
          <tbody id="attendanceTable">
            <!-- Real-time student rows will appear here -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Firebase Core SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Project Configuration & Logic -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
