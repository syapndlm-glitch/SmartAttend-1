<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartAttend | Teacher Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="teacher-body">
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <div class="dashboard-shell">
    <aside class="control-panel">
      <a href="index.html" class="brand"><span>SA</span> SmartAttend</a>
      
      <div class="panel-card">
        <span class="eyebrow">ACTIVE SESSION</span>
        <div id="code" class="code-display">------</div>
        <p class="timer-text">Expires in <span id="timer">01:00</span></p>

        <div class="qr-wrapper">
          <div id="qrcode"></div>
        </div>

        <div class="panel-actions">
          <button class="action-btn primary" onclick="generateNewCode()">Generate New Code</button>
          <button class="action-btn secondary" onclick="copyCode()">Copy Code</button>
        </div>
      </div>
    </aside>

    <main class="data-panel">
      <header class="panel-header">
        <div>
          <span class="eyebrow">LIVE MONITOR</span>
          <h1>Class Attendance Roster</h1>
        </div>
        <div class="header-right">
          <div class="badge"><span id="count">0</span> Students Present</div>
          <button class="action-btn danger" onclick="clearAttendance()">Reset Roster</button>
        </div>
      </header>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Roll Number</th>
              <th>Student Name</th>
              <th>Time Checked In</th>
            </tr>
          </thead>
          <tbody id="attendanceTable">
            <!-- Real-time student rows render here -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Firebase Core SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Project Configuration & Logic -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
